[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketedge"
version = "0.1.0"
description = "A local-first prediction-market quant workbench"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Eric Grill", email = "eric@ericgrill.com"}]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "textual>=0.52.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/EricGrill/marketedge"
Repository = "https://github.com/EricGrill/marketedge"
Issues = "https://github.com/EricGrill/marketedge/issues"

[project.scripts]
marketedge = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
