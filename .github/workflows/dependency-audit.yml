name: Dependency Audit

on:
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - constraints.txt
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - constraints.txt
      - .github/workflows/dependency-audit.yml
  schedule:
    # Weekly, Monday 13:00 UTC, so new advisories surface even without a push.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install pip-audit

      - name: Audit installed dependencies
        run: python -m pip_audit --strict --progress-spinner off
