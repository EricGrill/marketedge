name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project requires Python >=3.12 (pyproject `requires-python`, README
        # badge, and doctor's MIN_PYTHON_VERSION). Keep the matrix aligned.
        python-version:
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m black --check src tests

      - name: Lint
        run: python -m flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Type check
        run: python -m mypy src/

      - name: Test
        run: python -m pytest tests/ -q

      - name: Check dashboard JavaScript
        run: node --check web/app.js
